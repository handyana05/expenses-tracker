<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="shell__sidenav">
    <h2 class="shell__brand">Expense Tracker</h2>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">Dashboard</a>
      <a mat-list-item routerLink="/categories">Categories</a>
      <a mat-list-item routerLink="/transactions">Transactions</a>
      <a mat-list-item routerLink="/reports">Reports</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      <span>Expense Tracker</span>
      <span class="shell__spacer"></span>

      <button mat-button type="button" (click)="logout()">
        Logout
      </button>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
