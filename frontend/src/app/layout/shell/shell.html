<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="shell__sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()">

    <h2 class="shell__brand">Expense Tracker</h2>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="shell__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a
        mat-list-item
        routerLink="/categories"
        routerLinkActive="shell__nav-item--active"
        ariaCurrentWhenActive="page"
        (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Categories</span>
      </a>

      <a
        mat-list-item
        routerLink="/transactions"
        routerLinkActive="shell__nav-item--active"
        ariaCurrentWhenActive="page"
        (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Transactions</span>
      </a>

      <a
        mat-list-item
        routerLink="/reports"
        routerLinkActive="shell__nav-item--active"
        ariaCurrentWhenActive="page"
        (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Reports</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      @if (isMobile()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation"
          (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span>Expense Tracker</span>
      <span class="shell__spacer"></span>

      <button mat-button type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-toolbar>

    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
