<app-page-header
  title="Reports"
  subtitle="Analyze your income, expenses and balance by month">
</app-page-header>

<app-page-card>
  <form class="report-filters">
    <mat-form-field appearance="outline">
      <mat-label>Year</mat-label>
      <input
        matInput
        type="number"
        [ngModel]="year()"
        name="year"
        (ngModelChange)="year.set($event)" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Month</mat-label>
      <input
        matInput
        type="number"
        min="1"
        max="12"
        [ngModel]="month()"
        name="month"
        (ngModelChange)="month.set($event)" />
    </mat-form-field>

    <button mat-flat-button color="primary" type="button" (click)="reload()">
      <mat-icon>refresh</mat-icon>
      Load
    </button>
  </form>
</app-page-card>

<br />

@if (monthlySummary.isLoading()) {
  <app-loading-spinner />
} @else if (monthlySummary.error()) {
  <app-empty-state
    title="Could not load report"
    description="Please try again later.">
  </app-empty-state>
} @else {
  <div class="summary-grid">
    <app-summary-card
    title="Total Income"
    icon="payments"
    tone="income"
    [value]="monthlySummary.value().totalIncome" />

  <app-summary-card
    title="Total Expenses"
    icon="receipt_long"
    tone="expense"
    [value]="monthlySummary.value().totalExpenses" />

  <app-summary-card
    title="Balance"
    icon="account_balance_wallet"
    tone="balance"
    [value]="monthlySummary.value().balance" />
  </div>
}
